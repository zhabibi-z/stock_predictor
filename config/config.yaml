data:
  ticker: AAPL
  start: "2015-11-11"
  end: "2025-11-11"

features:
  sma_short: 5
  sma_long: 20
  rsi_window: 14
  bb_window: 20
  bb_std: 2.0
  macd_fast: 12
  macd_slow: 26
  macd_sig: 9
  atr_window: 14
  lag_periods: [1, 2, 5]
  vol_window: 20
  cols:
    - Daily_Return
    - SMA_5
    - SMA_20
    - RSI
    - BB_Pct
    - MACD_Hist
    - ATR_Norm
    - Volume_Ratio
    - Return_t1
    - Return_t2
    - Return_t5

validation:
  n_splits: 4
  purge_gap: 5
  holdout_start: "2024-03-22"
  validation_frac: 0.15

neural_network:
  epochs: 150
  batch_size: 32
  patience: 15
  default_seeds: 10
  app_seeds: 3   # smaller than default_seeds: app.py trades rigor for interactive speed
  hidden_layers: [128, 64, 32]
  dropout_rates: [0.30, 0.20, 0.15]
  learning_rate: 0.001
  lr_reduce_factor: 0.5
  lr_reduce_patience: 7
  min_lr: 0.000001

backtest:
  risk_free_rate: 0.04
  execution_lag: 1
  costs_bps: 5
  cost_sensitivity_grid: [0, 1, 5, 10]
  trading_days: 252

general:
  random_seed: 42
  plots_dir: plots
